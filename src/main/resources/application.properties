# Application Name
spring.application.name=Backend

# Database Configuration (Add ?sslmode=require for Render's PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=86400000
spring.ecom.app.jwtCookieName=ECommJwtToken

# Logging
logging.level.com.ayansh.E_Comm.Controller=DEBUG
logging.level.com.ayansh.E_Comm.Service=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=DEBUG
spring.jackson.deserialization.fail-on-null-for-primitives=true
logging.level.org.springframework.web.reactive.function.client=DEBUG

# API Keys
agro.api.key=${AGRO_API_KEY}
agro.api.url=https://api.agromonitoring.com
openweather.api.key=${OPENWEATHER_API_KEY}
openweather.api.url=https://api.openweathermap.org

## OAuth2 (Google)
#spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
#spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}

# Server Port (Render sets PORT=10000, defaults to 8080 locally)
server.port=${PORT:8080}